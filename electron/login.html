<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>跨易铺登录</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;margin:0;background:#f4f6f7;color:#182028}.box{margin:42px auto;width:370px;background:#fff;padding:28px 34px;border:1px solid #dfe4e7;border-radius:8px;box-shadow:0 8px 26px #18202822}h1{margin:0;color:#f06423;font-size:25px}p{color:#69747d;font-size:13px}.field{display:block;margin:18px 0 0;font-size:12px;font-weight:600}.field input{display:block;width:100%;box-sizing:border-box;margin-top:7px;height:42px;padding:0 11px;border:1px solid #cfd6da;border-radius:5px;font-size:14px}.remember{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:12px;color:#59666c}.button{width:100%;height:44px;border:0;border-radius:5px;background:#f06423;color:#fff;font-weight:700;font-size:14px}.button:disabled{opacity:.55}.error{min-height:20px;color:#b13a31;font-size:12px;margin-top:13px}.expiry{margin-top:18px;padding:10px;background:#eef8f7;color:#256b48;font-size:12px;border-radius:5px}</style></head>
<body><main class="box"><h1>跨易铺</h1><p>请输入 Alibaba 国际站账号和密码登录</p><label class="field">Alibaba 登录账号<input id="username" autocomplete="username"></label><label class="field">密码<input id="password" type="password" autocomplete="current-password"></label><label class="remember"><input id="remember" type="checkbox">记住账号密码</label><button class="button" id="login">登录</button><div class="error" id="error"></div><div class="expiry" id="expiry" hidden></div></main>
<script>const $=(id)=>document.getElementById(id);const api=window.kuaYipu;let authorized=false;if(!api){$('error').textContent='客户端组件加载失败，请重新解压完整安装包';$('login').disabled=true}else{api.loadCredentials().then((saved)=>{if(saved){$('username').value=saved.username||'';$('password').value=saved.password||'';$('remember').checked=true}});$('login').onclick=async()=>{if(authorized){$('login').disabled=true;$('login').textContent='正在打开…';$('error').textContent='';try{await api.enter()}catch(error){$('error').textContent=error?.message||'进入工作台失败，请重试';$('login').textContent='进入系统';$('login').disabled=false}return}$('error').textContent='';$('login').disabled=true;try{const result=await api.login({username:$('username').value,password:$('password').value,remember:$('remember').checked});authorized=true;$('expiry').hidden=false;$('expiry').textContent='授权有效期至：'+new Date(result.expiresAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});$('login').textContent='进入系统'}catch(error){$('error').textContent=error?.message||'登录失败';authorized=false}finally{$('login').disabled=false}}}</script></body></html>
