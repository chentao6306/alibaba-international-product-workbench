<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>抄得快登录</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;margin:0;background:#f4f6f7;color:#182028}.box{margin:28px auto;width:370px;max-width:calc(100% - 76px);background:#fff;padding:26px 30px;border:1px solid #dfe4e7;border-radius:8px;box-shadow:0 8px 26px #18202822}.brand-lockup{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}.brand-lockup h1{margin:0;color:#f06423;font-size:31px;line-height:1.2;letter-spacing:0}.brand-lockup span{color:#59666c;font-size:12px;font-weight:600;letter-spacing:0}p{color:#69747d;font-size:13px}.field{display:block;margin:18px 0 0;font-size:12px;font-weight:600}.field input{display:block;width:100%;box-sizing:border-box;margin-top:7px;height:42px;padding:0 11px;border:1px solid #cfd6da;border-radius:5px;font-size:14px}.remember{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:12px;color:#59666c}.button{width:100%;height:44px;border:0;border-radius:5px;background:#f06423;color:#fff;font-weight:700;font-size:14px}.button:disabled{opacity:.55}.error{min-height:20px;color:#b13a31;font-size:12px;margin-top:13px;overflow-wrap:anywhere}.expiry{margin-top:18px;padding:10px;background:#eef8f7;color:#256b48;font-size:12px;border-radius:5px}small{color:#59666c;font-weight:400;margin-left:8px}#diagnosticBox{margin-top:14px;font-size:12px;color:#59666c}#diagnosticBox summary{cursor:pointer}#diagnosticBox button{padding:8px 12px;border:1px solid #cfd6da;border-radius:5px;background:white;color:#182028;font:inherit;cursor:pointer}#diagnosticBox button:disabled{opacity:.55}#diagnosticContent{font-family:Consolas,monospace;font-size:11px;background:#f4f6f7;padding:8px}</style></head>
<body><main class="box"><header class="brand-lockup"><h1>抄得快</h1><span>抄得快，赚得快！创新哪有抄的快！</span></header><p>请输入 Alibaba 国际站账号和密码登录</p><label class="field">Alibaba 登录账号<input id="username" autocomplete="username" maxlength="200"></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" maxlength="1024"></label><label class="field">软件授权码<small id="activationStatus"></small><input id="activationCode" type="password" autocomplete="off" placeholder="管理员提供的授权码" maxlength="100"></label><label class="remember"><input id="remember" type="checkbox">记住账号密码</label><button class="button" id="login">登录</button><div class="error" id="error" role="alert"></div><div class="expiry" id="expiry" hidden></div><details id="diagnosticBox"><summary>问题反馈</summary><label class="field">问题描述<textarea id="diagnosticNote" maxlength="1000" rows="3" style="width:100%;box-sizing:border-box;margin:8px 0" placeholder="请描述出现的问题"></textarea></label><button id="diagnosticUpload" type="button">上传日志</button> <button id="diagnosticClear" type="button">清理日志</button><p id="diagnosticStatus" role="status"></p></details></main>
<script src="./login.js"></script></body></html>
