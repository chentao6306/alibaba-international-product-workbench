# Website, private admin entry and client API share the existing auth service.
# Install as /etc/nginx/sites-available/copyfast-website and enable by symlink.
# Mark the existing IP server's 443 listeners default_server before enabling.
# Historical domain migration configuration. RETIRED 2026-10-08.
# Do not enable: the production service uses only 106.55.45.126 with IP HTTPS.
# Kept solely as a rollback reference for the 2026-10-06 migration record.
server {
    # Port 80 already accepts TLS for legacy desktop clients on this server.
    # Plain HTTP is redirected by error 497 without changing that listener.
    listen 80 ssl;
    listen [::]:80 ssl;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name copyfast.com.cn www.copyfast.com.cn;

    ssl_certificate /etc/nginx/ssl/copyfast.com.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/copyfast.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;
    client_max_body_size 128k;

    error_page 497 =308 https://copyfast.com.cn$request_uri;
    if ($host = www.copyfast.com.cn) {
        return 308 https://copyfast.com.cn$request_uri;
    }

    location = / {
        return 308 /website/;
    }
    include /etc/nginx/snippets/chaodekuai-website.conf;

    location ^~ /updates/chaodekuai/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /api/admin/updates {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location /api/admin/updates/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location = /api/admin/announcement-images {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location / {
        # The service exposes admin HTML only at its configured private path.
        # Admin APIs still require an authenticated administrator session.
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
