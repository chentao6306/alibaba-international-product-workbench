# Include INSIDE the existing HTTPS server block (domain or IP both work).
# Copy dist-website contents to /var/www/chaodekuai-website before enabling.
# Existing /updates/chaodekuai/ proxy routes must still reach the auth service.
location = /website {
    return 308 /website/;
}
location ^~ /website/ {
    alias /var/www/chaodekuai-website/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
