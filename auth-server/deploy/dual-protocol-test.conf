server {
    listen 127.0.0.1:8843 ssl;
    server_name 106.55.45.126;
    ssl_certificate /etc/letsencrypt/live/106.55.45.126/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/106.55.45.126/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 = @plain;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location @plain {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
