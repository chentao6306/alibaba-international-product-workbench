server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 128k;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    # Existing clients need this endpoint until their HTTPS update is installed.
    location /api/client/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/announcements { proxy_pass http://127.0.0.1:8790; }
    location / { return 308 https://106.55.45.126$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 106.55.45.126;
    ssl_certificate /etc/letsencrypt/live/106.55.45.126/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/106.55.45.126/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;
    client_max_body_size 128k;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
