# Enable TLS independently before redirecting existing HTTP clients.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 106.55.45.126;
    ssl_certificate /etc/letsencrypt/live/106.55.45.126/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/106.55.45.126/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
