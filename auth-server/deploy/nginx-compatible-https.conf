# HTTPS uses standard port 443. Keep TLS on 80 for installed 1.4.6 clients
# while they migrate to the standard endpoint.
server {
    listen 80 ssl default_server;
    listen [::]:80 ssl default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 106.55.45.126;
    ssl_certificate /etc/letsencrypt/live/106.55.45.126/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/106.55.45.126/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;
    client_max_body_size 128k;
    error_page 497 = @plain_http;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    # Optional website snippet is installed by website/deploy/install.sh.
    include /etc/nginx/snippets/chaodekuai-website*.conf;
    location /api/admin/updates/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location = /api/admin/announcement-images {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location = /api/client/diagnostics {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location @plain_http {
        root /var/lib/letsencrypt;
        try_files $uri @legacy_client;
    }
    location @legacy_client {
        # Never serve the administration UI or its login over plaintext.
        if ($uri !~ "^/(api/client/(login|heartbeat)|api/announcements|health)$") {
            return 308 https://106.55.45.126$request_uri;
        }
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
    }
}
