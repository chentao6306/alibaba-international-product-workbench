<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抄得快授权管理</title><link rel="stylesheet" href="/admin.css"></head>
<body><main class="wrap">
  <header><h1>抄得快授权管理</h1><button id="logout" class="secondary" hidden>退出登录</button></header>
  <div id="msg" class="status-message" role="status" aria-live="polite"></div>
  <section id="loginBox"><h2>管理员登录</h2><form id="loginForm" class="row"><label class="field">管理员账号<input id="adminUser" autocomplete="username" required></label><label class="field">管理员密码<input id="adminPass" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
  <div id="app" hidden>
    <div id="stats" class="stats"></div>
    <nav class="tabs" role="tablist"><button role="tab" id="accountsTab" aria-selected="true">授权账号</button><button role="tab" id="announcementsTab" aria-selected="false">公告管理</button></nav>
    <div id="accountsPanel">
      <section><h2>添加或延长授权</h2><form id="activateForm" class="row"><label class="field">Alibaba 登录账号<input id="account" required maxlength="200"></label><label class="field">授权天数<select id="days"><option value="1">1 天</option><option value="30" selected>30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">365 天</option><option value="custom">自定义</option></select></label><label id="customDaysField" class="field" hidden>自定义天数<input id="customDays" type="number" min="1" max="36500" value="30"></label><label class="field grow">备注<input id="note" maxlength="2000"></label><button>保存授权</button></form></section>
      <section><form id="filterForm" class="row"><label class="field grow">搜索账号或备注<input id="search" type="search" placeholder="搜索账号或备注"></label><label class="field">账号状态<select id="status"><option value="all">全部状态</option><option value="active">正常</option><option value="expired">已到期</option><option value="paused">已停用</option><option value="revoked">已注销</option></select></label><label class="field">每页<select id="pageSize"><option>10</option><option selected>20</option><option>50</option><option>100</option></select></label><button class="secondary">查询</button></form><div id="licenses" class="table-wrap"></div><div id="licensePages" class="pagination"></div></section>
    </div>
    <div id="announcementsPanel" hidden><section><div class="row"><h2 style="flex:1;margin:0">公告管理</h2><button id="createNotice">新建公告</button></div><div id="announcements" class="table-wrap"></div><div id="noticePages" class="pagination"></div></section></div>
  </div>
  <dialog id="noticeDialog"><button class="close-dialog" aria-label="关闭">×</button><h2 id="noticeHeading">新建公告</h2><form id="noticeForm"><label class="field">标题<input id="noticeTitle" maxlength="160" required></label><label class="field">展示方式<select id="noticeKind"><option value="notice">公告列表</option><option value="popup">弹窗公告（同时进入公告列表）</option></select></label><label class="field">正文<textarea id="noticeContent" maxlength="20000" required></textarea></label><label class="field">发布状态<select id="noticeStatus"><option value="draft">草稿</option><option value="published">发布</option><option value="withdrawn">撤回</option></select></label><div class="dialog-actions"><button type="button" class="secondary" id="previewNotice">预览</button><button type="button" class="secondary" id="cancelNotice">取消</button><button id="saveNotice">保存公告</button></div><div id="noticeError" class="status-message" role="status"></div></form></dialog>
  <dialog id="previewDialog"><button class="close-dialog" aria-label="关闭">×</button><h2 id="previewTitle"></h2><div id="previewContent" class="notice-preview"></div></dialog>
  <dialog id="actionDialog"><h2 id="actionHeading"></h2><form id="actionForm"><p id="actionText"></p><label id="extendField" class="field" hidden>延长天数<input id="extendDays" type="number" min="1" max="36500" value="30"></label><div class="dialog-actions"><button type="button" id="cancelAction" class="secondary">取消</button><button id="confirmAction">确认</button></div><div id="actionError" class="status-message"></div></form></dialog>
</main><script src="/admin.js"></script></body></html>
