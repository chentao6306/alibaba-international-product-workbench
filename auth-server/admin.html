<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抄得快授权管理</title><style>body{font:14px Arial,"Microsoft YaHei",sans-serif;background:#f3f5f6;color:#182028;margin:0}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}section{background:#fff;border:1px solid #dfe4e7;border-radius:7px;padding:20px;margin:14px 0}h1{margin:0;color:#f06423}h2{font-size:16px;margin:0 0 15px}input,select,button{height:36px;border:1px solid #cbd3d7;border-radius:5px;padding:0 10px;font:inherit}button{background:#f06423;border-color:#d84d0e;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#fff;color:#334047;border-color:#cbd3d7}button.danger{background:#fff4f2;color:#a83c32;border-color:#efc6c2}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;color:#69747d;font-size:12px}.field input,.field select{min-width:180px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8f9f9;border:1px solid #e1e6e8;padding:13px;border-radius:5px}.stat b{display:block;font-size:24px}.stat span{color:#69747d;font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid #edf0f1;text-align:left;font-size:12px}th{color:#69747d;font-weight:500}.actions{display:flex;gap:5px;flex-wrap:wrap}.msg{color:#a83c32;min-height:20px;margin-top:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main class="wrap"><h1>抄得快授权管理</h1><section id="loginBox"><h2>管理员登录</h2><div class="row"><label class="field">管理员账号<input id="adminUser" autocomplete="username"></label><label class="field">管理员密码<input id="adminPass" type="password" autocomplete="current-password"></label><button id="adminLogin">登录</button></div><div id="msg" class="msg"></div></section><div id="app" hidden><section><h2>数据统计</h2><div id="stats" class="stats"></div></section><section><h2>添加或延长授权</h2><div class="row"><label class="field">Alibaba 登录账号<input id="account"></label><label class="field">授权天数<select id="days"><option value="1">1 天</option><option value="30">1 个月（30天）</option><option value="90">1 个季度（90天）</option><option value="180">半年（180天）</option><option value="365">1 年（365天）</option><option value="custom">自定义</option></select></label><label class="field">自定义天数<input id="customDays" type="number" min="1" value="30"></label><label class="field">备注<input id="note"></label><button id="activate">保存授权</button></div></section><section><h2>授权账号</h2><div id="licenses"></div></section></div></main><script>let token='';const $=id=>document.getElementById(id),api=async(path,opt={})=>{const r=await fetch(path,{...opt,headers:{'content-type':'application/json',authorization:`Bearer ${token}`,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d};const msg=t=>{$('msg').textContent=t||''};async function load(){const [s,l]=await Promise.all([api('/api/admin/stats'),api('/api/admin/licenses')]);$('stats').innerHTML=[['paidUsers','有效授权用户'],['activeUsers24h','24小时活跃'],['activeUsers30d','30天活跃'],['loginCount','登录次数']].map(([k,n])=>`<div class="stat"><b>${s[k]}</b><span>${n}</span></div>`).join('');$('licenses').innerHTML=`<table><thead><tr><th>Alibaba账号</th><th>状态</th><th>开始</th><th>到期（中国标准时间）</th><th>最近登录</th><th>操作</th></tr></thead><tbody>${l.map(x=>`<tr><td>${x.alibaba_account}</td><td>${x.status}</td><td>${new Date(x.starts_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}</td><td>${new Date(x.expires_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}</td><td>${x.last_seen_at?new Date(x.last_seen_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'-'}</td><td class="actions"><button class="secondary" onclick="extend('${x.id}')">延长</button>${x.status==='paused'?`<button onclick="act('${x.id}','resume')">恢复</button>`:`<button class="secondary" onclick="act('${x.id}','pause')">暂停</button>`}<button class="danger" onclick="act('${x.id}','revoke')">注销</button></td></tr>`).join('')}</tbody></table>`}window.act=async(id,action)=>{try{await api('/api/admin/licenses/'+id,{method:'PATCH',body:JSON.stringify({action})});await load()}catch(e){msg(e.message)}};window.extend=async id=>{const days=prompt('延长天数', '30');if(!days)return;try{await api('/api/admin/licenses/'+id,{method:'PATCH',body:JSON.stringify({action:'extend',days:Number(days)})});await load()}catch(e){msg(e.message)}};$('adminLogin').onclick=async()=>{try{const d=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('adminUser').value,password:$('adminPass').value})}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x});token=d.token;$('loginBox').hidden=true;$('app').hidden=false;await load()}catch(e){msg(e.message)}};$('activate').onclick=async()=>{try{const selected=$('days').value;const days=selected==='custom'?Number($('customDays').value):Number(selected);await api('/api/admin/licenses',{method:'POST',body:JSON.stringify({alibabaAccount:$('account').value,days,note:$('note').value})});$('account').value='';await load();msg('')}catch(e){msg(e.message)}};</script></body></html>
