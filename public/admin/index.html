<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>跨易铺管理后台</title>
  <style>
    :root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#1f2a30;background:#f3f5f6}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 16px}.muted{color:#71808a;font-size:12px}.panel{background:#fff;border:1px solid #dfe4e7;border-radius:8px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid #e3e8ea;border-radius:6px;padding:15px}.metric b{display:block;font-size:25px;margin-top:8px}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}.field{display:grid;gap:6px;font-size:12px;color:#52616a}.field input,.field select{height:38px;border:1px solid #cfd6da;border-radius:5px;padding:0 9px;font:inherit}.btn{height:38px;padding:0 15px;border-radius:5px;border:1px solid #d84d0e;background:#f06423;color:#fff;font-weight:600;cursor:pointer}.btn.secondary{background:#fff;color:#34444d;border-color:#cfd6da}.btn.danger{background:#fff;color:#c53f2d;border-color:#ffb9aa}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e8ecee;white-space:nowrap}th{color:#66757e;background:#f8fafb}.actions{display:flex;gap:6px}.login{max-width:390px;margin:12vh auto}.error{color:#c53f2d;background:#fff1ee;border:1px solid #ffd4ca;padding:9px;border-radius:5px;font-size:12px;margin:10px 0}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}.form-grid .field:first-child{grid-column:1/-1}.form-grid .btn{grid-column:1/-1}}
  </style>
</head>
<body><main id="app"></main>
<script>
const app=document.getElementById('app'); const json=(url,opt={})=>fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d});
function login(){app.innerHTML='<section class="panel login"><h1>跨易铺管理后台</h1><p class="muted">管理员登录后管理国际站授权账号</p><form id="login"><label class="field">管理员账号<input name="user" required autocomplete="username"></label><label class="field" style="margin-top:12px">管理员密码<input name="password" type="password" required autocomplete="current-password"></label><div id="err"></div><button class="btn" style="width:100%;margin-top:16px">登录</button></form></section>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await json('/api/admin/login',{method:'POST',body:JSON.stringify({user:f.get('user'),password:f.get('password')})});render()}catch(x){document.getElementById('err').innerHTML='<div class="error">'+x.message+'</div>'}}}
async function render(){try{const [stats,data]=await Promise.all([json('/api/admin/stats'),json('/api/admin/licenses')]);const licenses=data.licenses||[];const inactive=(stats.pausedLicenses||0)+(stats.revokedLicenses||0);app.innerHTML='<header><div><h1>跨易铺管理后台</h1><span class="muted">授权有效期按中国标准时间显示，服务器内部使用 UTC</span></div><button id="logout" class="btn secondary">退出</button></header><section class="grid"><div class="metric">授权账号总数<b>'+stats.totalLicenses+'</b></div><div class="metric">有效授权<b>'+stats.activeLicenses+'</b></div><div class="metric">暂停/注销<b>'+inactive+'</b></div><div class="metric">最近登录<b>'+((stats.recentLogins||[]).length)+'</b></div></section><section class="panel"><h2>添加授权账号</h2><form id="add" class="form-grid"><label class="field">阿里巴巴国际站账号<input name="account" required></label><label class="field">授权期限<select name="term"><option value="1d">1天</option><option value="1m">1个月</option><option value="quarter">1个季度</option><option value="half-year">半年</option><option value="year">1年</option><option value="custom">自定义天数</option></select></label><label class="field">自定义天数<input name="days" type="number" min="1" placeholder="仅自定义时填写"></label><button class="btn">开通授权</button></form></section><section class="panel"><h2>授权账号</h2><div class="table-wrap"><table><thead><tr><th>账号</th><th>状态</th><th>到期时间（中国标准时间）</th><th>最近登录</th><th>设备</th><th>操作</th></tr></thead><tbody>'+licenses.map(x=>'<tr><td>'+x.account+'</td><td>'+x.status+'</td><td>'+(x.expiresAtChina||'-')+'</td><td>'+(x.lastLoginAtChina||'-')+'</td><td>'+(x.lastDeviceId||'-')+'</td><td class="actions"><button class="btn secondary" data-action="'+(x.status==='active'?'pause':'activate')+'" data-id="'+x.account+'">'+(x.status==='active'?'暂停':'恢复')+'</button><button class="btn secondary" data-action="extend" data-id="'+x.account+'">续期30天</button><button class="btn danger" data-action="revoke" data-id="'+x.account+'">注销</button></td></tr>').join('')+'</tbody></table></div></section>';document.getElementById('logout').onclick=async()=>{await json('/api/admin/logout',{method:'POST'});login()};document.getElementById('add').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await json('/api/admin/licenses',{method:'POST',body:JSON.stringify({account:f.get('account'),term:f.get('term'),days:Number(f.get('days')||0)})});render()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const a=b.dataset.action,id=encodeURIComponent(b.dataset.id);if(a==='extend')await json('/api/admin/licenses/'+id,{method:'PATCH',body:JSON.stringify({action:'extend',days:30})});else if(a==='revoke')await json('/api/admin/licenses/'+id,{method:'DELETE'});else await json('/api/admin/licenses/'+id,{method:'PATCH',body:JSON.stringify({status:a==='pause'?'paused':'active'})});render()})}catch(e){if(String(e.message).includes('401'))login();else app.innerHTML='<section class="panel error">'+e.message+'</section>'}}
render();
</script></body></html>
